ShortDescription: Turn an old Android phone into a desk panel for your PC.
Description: |-
  Sidelight has two parts: an Android app that runs full screen on an old phone, and this agent, which lives in the
  tray and feeds it over USB or Wi-Fi: widgets for the PC, AI coding sessions and quotas, music, calendars,
  Home Assistant, OBS, Docker, webhooks and more. After installing, start Sidelight, plug the phone in and use
  Settings › General › Install the phone app.
