name: release

# Builds every release artifact on GitHub's runners and publishes them with checksums as a GitHub release.
# scripts/release.ps1 dispatches this workflow. Start it from Actions › release › Run workflow after bumping the version.
#
# The APK must be signed with the same key as the app already on the phones, or Android refuses the update. Add the
# key as repository secrets: SIDELIGHT_KEYSTORE_BASE64 (base64 of the .jks / .keystore file), SIDELIGHT_STORE_PASSWORD,
# SIDELIGHT_KEY_ALIAS and SIDELIGHT_KEY_PASSWORD. Without them the workflow stops before publishing anything.
#
# Automation for this repository (DevPatel04/phonebox):
#  - push to main  → stable GitHub release from the version in the project files (bump first; duplicate tags fail)
#  - push to test  → pre-release numbered <version>.<run> (0.9.22.57) for the Testing update channel
#  - workflow_dispatch → same as a push to the chosen branch; set draft=true to review assets before publishing
#
# Test builds sort after the release they build on and before the next one, keep the APK's versionCode (so adb
# installs them over the release and the next release over them), and never touch the Scoop/winget manifests.
on:
  push:
    branches: [main, test]
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft (stable/main only; ignored for test pre-releases)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/build.yml

  version:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Read and check the version
        run: |
          v=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' agent/Sidelight.Agent/Sidelight.Agent.csproj | head -n1)
          grep -q "versionName = \"$v\"" android/app/build.gradle.kts || { echo "::error::android versionName does not match $v"; exit 1; }
          if [ "$GITHUB_REF" = refs/heads/test ]; then v="$v.$GITHUB_RUN_NUMBER"; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then echo "::error::v$v is already released; bump the version first"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Check release metadata
        run: python3 tools/check-release.py

  apk:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SIDELIGHT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::add the SIDELIGHT_KEYSTORE_BASE64 secret (see the top of release.yml)"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build the release APK
        working-directory: android
        env:
          SIDELIGHT_STORE_FILE: ${{ runner.temp }}/release.keystore
          SIDELIGHT_STORE_PASSWORD: ${{ secrets.SIDELIGHT_STORE_PASSWORD }}
          SIDELIGHT_KEY_ALIAS: ${{ secrets.SIDELIGHT_KEY_ALIAS }}
          SIDELIGHT_KEY_PASSWORD: ${{ secrets.SIDELIGHT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          # a test build's version (0.9.14.57) only exists here, so the app reports it to the agent's updater
          sed -i 's/versionName = "[^"]*"/versionName = "${{ needs.version.outputs.version }}"/' app/build.gradle.kts
          ./gradlew assembleRelease --console=plain
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Sidelight-${{ needs.version.outputs.version }}.apk"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-apk
          path: dist/

  agent:
    needs: version
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64, tfm: net10.0-windows10.0.19041.0 }
          - { os: ubuntu-latest, rid: linux-x64, tfm: net10.0 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, tfm: net10.0 }
          - { os: macos-latest, rid: osx-arm64, tfm: net10.0 }
          - { os: macos-15-intel, rid: osx-x64, tfm: net10.0 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read # SignPath fetches the unsigned agent from this run's artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test agent/Sidelight.Agent.Tests --nologo
      # Self-contained single file: no .NET runtime to install. Not compressed (the zip is barely smaller and a
      # compressed bundle costs about 90 MB more memory in a process that runs all day); native libraries stay
      # loose next to the exe instead of being extracted to the temp folder at run time.
      - name: Publish (self-contained, single file)
        run: dotnet publish agent/Sidelight.Agent -c Release -f ${{ matrix.tfm }} -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:Version=${{ needs.version.outputs.version }} -o out --nologo
      - name: Sign macOS apphost ad hoc
        if: startsWith(matrix.rid, 'osx-')
        run: codesign --force --sign - out/SidelightAgent
      # Authenticode signing through SignPath Foundation, before the smoke test, the zip, the checksums, the attestation
      # and the Scoop/winget hash, which all cover the signed file. It is on while the repository variable
      # SIGNPATH_SIGNING_POLICY names a policy (release-signing); each request waits for a manual approval in SignPath.
      - name: Sign SidelightAgent.exe (SignPath)
        if: matrix.rid == 'win-x64' && vars.SIGNPATH_SIGNING_POLICY != ''
        uses: ./.github/actions/sign-windows-agent
        with:
          exe: out/SidelightAgent.exe
          signing-policy: ${{ vars.SIGNPATH_SIGNING_POLICY }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          trusted: ${{ vars.SIGNPATH_SIGNING_POLICY == 'release-signing' }}
      - name: Smoke-test the published agent on its native architecture
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'out/SidelightAgent.exe' } else { 'out/SidelightAgent' }
          python tools/smoke-agent.py $exe --version '${{ needs.version.outputs.version }}'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path out/* -DestinationPath "dist/SidelightAgent-${{ needs.version.outputs.version }}-${{ matrix.rid }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-agent-${{ matrix.rid }}
          path: dist/

  publish:
    needs: [version, apk, agent]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Attest release artifacts
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.apk
            dist/*.zip
      - name: Save the provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/Sidelight-${{ needs.version.outputs.version }}.intoto.jsonl"
      - name: Checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 7
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 5
          test "$(find . -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          sha256sum * > "SHA256SUMS-${{ needs.version.outputs.version }}.txt"
          cat "SHA256SUMS-${{ needs.version.outputs.version }}.txt"
      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ needs.version.outputs.version }}"
          # the section for this version, else the "Unreleased" one
          section() { awk -v v="$1" '/^## /{ if (on) exit; on = ($2 == v); next } on' CHANGELOG.md; }
          section "$v" > notes.md
          [ -s notes.md ] || section Unreleased > notes.md
          [ -s notes.md ] || echo "Sidelight $v" > notes.md
          if [ "$GITHUB_REF" = refs/heads/test ]; then printf 'Test build from the test branch (%s). Installed only by agents on the Testing update channel.\n' "${GITHUB_SHA::7}" > notes.md; fi
          cat >> notes.md <<'EOF'

          ---
          [Code signing policy](https://github.com/${{ github.repository }}#code-signing-policy) · [Privacy policy](https://github.com/${{ github.repository }}/blob/main/PRIVACY.md)
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.version }}"
          draft_flag=''
          if [ "${{ github.ref }}" = 'refs/heads/main' ] && [ '${{ inputs.draft }}' = 'true' ]; then draft_flag='--draft'; fi
          pre_flag=''
          if [ "${{ github.ref }}" = 'refs/heads/test' ]; then pre_flag='--prerelease --latest=false'; fi
          gh release create "v$v" dist/* --title "Sidelight $v" --notes-file notes.md --target "${{ github.sha }}" $draft_flag $pre_flag
      # a draft's downloads are not public yet, so the package manifests follow only published releases
      - name: Update the Scoop bucket and the winget manifests
        if: ${{ github.ref == 'refs/heads/main' && inputs.draft != true }}
        run: |
          v="${{ needs.version.outputs.version }}"
          sha=$(sha256sum "dist/SidelightAgent-$v-win-x64.zip" | cut -d' ' -f1)
          repo='${{ github.repository }}'
          python3 - "$v" "$sha" "$repo" <<'PY'
          import json, sys
          v, sha, repo = sys.argv[1], sys.argv[2], sys.argv[3]
          p = 'bucket/sidelight.json'
          m = json.load(open(p, encoding='utf-8'))
          m['version'] = v
          m['homepage'] = f'https://github.com/{repo}'
          m['architecture']['64bit']['url'] = f'https://github.com/{repo}/releases/download/v{v}/SidelightAgent-{v}-win-x64.zip'
          m['architecture']['64bit']['hash'] = sha
          # the agent is self-contained since 0.9.7: no .NET runtime to suggest
          m.get('suggest', {}).pop('.NET Desktop Runtime 10', None)
          if 'autoupdate' in m:
              m['autoupdate']['architecture']['64bit']['url'] = f'https://github.com/{repo}/releases/download/v$version/SidelightAgent-$version-win-x64.zip'
          open(p, 'w', encoding='utf-8').write(json.dumps(m, indent=4, ensure_ascii=False) + '\n')
          PY
          python3 packaging/winget/make-manifests.py "$v" "$sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/sidelight.json packaging/winget/manifests
          git commit -m "Scoop and winget manifests for $v"
          git push origin HEAD:main
